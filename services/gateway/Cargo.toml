[package]
name = "gateway"
description = "WebSocket Gateway service"
authors = ["Dmitriy Chukhno <dmitr1sdadaya@protonmail.com>"]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[[bin]]
path = "src/main.rs"
name = "gateway"

[dependencies]
# Asynchronous and Streams
tokio = { version = "1.35.1", features = ["full"] }
tokio-stream = "0.1.14"
futures = "0.3.30"
futures-util = "0.3.31"
async-trait = "0.1.75"

# WebSocket Handling
tungstenite = "0.24.0"
tokio-tungstenite = "0.24.0"

# Serialization/Deserialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3.0"

# Date and Time Handling
chrono = { version = "0.4.26", features = ["serde"] }

# Security and Cryptography
sha2 = "0.10.8"
hmac = "0.12.1"
argon2 = { version = "0.5.0", features = ["std"] }
totp-rs = { version = "5.0.2", features = ["gen_secret"] }
x25519-dalek = "2.0.1"

# Random Number Generation
rand = "0.8.5"
rand_chacha = "0.3.1"

# Byte and Encoding Utilities
bytes = "1.4.0"
base64 = "0.22.1"
base64-url = "3.0.0"
hex = "0.4.3"

# Database Management
sqlx = { version = "0.7.4", features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
  "macros",
  "migrate",
  "rust_decimal",
  "json",
] }

# Data Compression
flate2 = { version = "1.0.34", features = ["zlib-ng"], default-features = false }

# Utilities and Supporting Libraries
validator = { version = "0.18.0", features = ["derive"] }
thiserror = "1.0.56"
regex = "1.8.4"
log = "0.4.22"
env_logger = "0.11.5"
bitflags = "2.4.0"
jemallocator = "0.5.4"

# Image Generation and Processing
qrcode = "0.14.1"
image = "0.25.4"

# Cloud Storage
rust-s3 = "0.34.0"

# Local Dependencies
id = { path = "../../packages/id-rs" }

[build-dependencies]
tonic-build = "0.11.0"
